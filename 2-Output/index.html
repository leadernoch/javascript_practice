
<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Parking Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Left Side -->
        <div class="left">
            <h2>ការគណនាថ្លៃផ្ញើយានជំនិះ</h2>
            <div class="form-group">
                <label>ប្រភេទយានជំនិះ:</label>
                <select id="vehicle">
                    <option value="car">ឡាន</option>
                    <option value="motorcycle">ម៉ូតូ</option>
                </select>
            </div>
            <div class="form-group">
                <label>ម៉ោងចូល</label>

                <input type="time" id="start">
            </div>

            <div class="form-group">
                <label>ម៉ោងចេញ</label>

                <input type="time" id="end">
            </div>

            <div class="form-group">
                <label>ថ្លៃផ្ញើ រៀល</label>

                <input type="text" id="riel"
                       placeholder="៛" readonly>
            </div>
            <div class="form-group">
                <label>ថ្លៃផ្ញើ ដុល្លារ</label>

                <input type="text" id="dollar"
                       placeholder="$" readonly>
            </div>
            <button onclick="Calculate()">គណនា</button>
            <div id="result"></div>
        </div>
        <div class="right">
            <h3>ឡាន</h3>
            <p>
                + ប្រសិនបើផ្ញើ 8h ⇒ 1h = 500៛
                <br>
                + លើសពី 8h ⇒ 1h = 1000៛
            </p>
            <br>
            <h3>ម៉ូតូ</h3>
            <p>
                + ប្រសិនបើផ្ញើ 8h ⇒ 1h = 200៛
                <br>
                + លើសពី 8h ⇒ 1h = 300៛
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
