<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title"></h1>
    <button onclick="addText()">Click Me</button>
    <script>
        
        function addText() {
            document.getElementById("title").textContent = "Text added!";
        }
    </script>
</body>
</html>
